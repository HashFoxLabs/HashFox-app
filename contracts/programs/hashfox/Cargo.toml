[package]
name = "hashfox"
version = "0.1.0"
description = "HashFox — unified paper-trading program (prediction markets, spot, perps, limit orders)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "hashfox"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []

[dependencies]
anchor-lang = "0.30.1"
session-keys = { version = "3.0.11", features = ["no-entrypoint"] }
