# Cloudflare Workers (Git integration: build `npm run build`, deploy `npx wrangler deploy`, root `/frontend`).
# Matches https://svelte.dev/docs/kit/adapter-cloudflare — Workers + Static Assets.
#
# For Cloudflare Pages (Git) instead: no wrangler deploy step — set build output to `.svelte-kit/cloudflare` only.

name = "hashfox-app"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_als", "nodejs_compat"]

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

# Runtime config. Ships with every deploy so the app does not depend on
# dashboard env vars being present. Public + private API keys are committed
# here intentionally — promote any genuinely high-risk key to a Worker secret
# (`wrangler secret put NAME`) later if you want to remove it from the repo.
